name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist/ is up to date
        run: |
          git diff --exit-code dist/ || {
            echo "::error::dist/ is stale — run 'npm run build' and commit the result.";
            exit 1;
          }

      # Catches a card turning itself into a scroll container, which on a
      # phone swallows the swipe meant for the dashboard view.
      - name: Scroll check (phone width)
        run: |
          npx --yes playwright install --with-deps chromium
          npm run check:scroll

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
