name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rohlik-cards.js
          generate_release_notes: true
          # Tags with a pre-release suffix (v0.1.0-alpha, v1.0.0-beta.1) are
          # published as pre-releases, which HACS hides unless "show beta" is on.
          prerelease: ${{ contains(github.ref_name, '-') }}
