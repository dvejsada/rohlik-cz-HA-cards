<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Rohlík.cz cards preview</title>
    <style>
      /* ---- HA theme CSS variables (light) ---- */
      :root {
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --card-background-color: #ffffff;
        --primary-background-color: #fafafa;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: rgba(0, 0, 0, 0.12);
        --success-color: #4caf50;
        --warning-color: #ff9800;
        --error-color: #db4437;
        --ha-card-border-radius: 12px;
        --ha-card-background: var(--card-background-color);
        --state-icon-color: #44739e;
      }

      /* ---- HA theme CSS variables (dark), toggled via body[data-theme="dark"] ---- */
      body[data-theme="dark"] {
        --primary-color: #03a9f4;
        --accent-color: #ff9800;
        --card-background-color: #1c1c1c;
        --primary-background-color: #111111;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(255, 255, 255, 0.12);
        --success-color: #4caf50;
        --warning-color: #ffb74d;
        --error-color: #ff6659;
        --ha-card-border-radius: 12px;
        --ha-card-background: var(--card-background-color);
        --state-icon-color: #8ba5c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #app {
        width: 100%;
        max-width: 1000px;
        box-sizing: border-box;
        margin: 0 auto;
        padding: 24px;
      }

      .badge-row {
        display: flex;
        padding: 4px 0 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        align-items: start;
      }

      .grid > div {
        min-width: 0;
      }

      .span-2 {
        grid-column: 1 / -1;
      }

      /* ?grid=sections: a replica of HA's sections grid (hui-grid-section.ts).
         Numeric rows give the cell a fixed height and span; "auto" spans one
         content-sized track. Cards sit in an unstyled inline <hui-card>, like
         in HA. */
      .ha-section {
        --row-gap: 8px;
        --column-gap: 8px;
        --row-height: 56px;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: auto;
        row-gap: var(--row-gap);
        column-gap: var(--column-gap);
        margin: 0 auto;
      }

      .ha-section .card {
        position: relative;
        grid-row: span var(--row-size, 1);
        grid-column: span min(var(--column-size, 1), 12);
        display: block;
      }

      .ha-section .card.fit-rows {
        height: calc((var(--row-size, 1) * (var(--row-height) + var(--row-gap))) - var(--row-gap));
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="badge-row" id="rohlik-delivery-badge"></div>
      <div class="grid">
        <div id="rohlik-delivery-card"></div>
        <div id="rohlik-cart-card"></div>
        <div id="rohlik-slots-card" class="span-2"></div>
        <div id="rohlik-favourites-card" class="span-2"></div>
        <div id="rohlik-account-card"></div>
        <div id="rohlik-spending-card" class="span-2"></div>
      </div>
    </div>

    <script type="module">
      import { installShims, installFixedClock, buildHass, DEVICE_ID, writeDeliveredMemory, clearDeliveryMemory } from "./mock-hass.js";

      const params = new URLSearchParams(location.search);
      const lang = params.get("lang") === "en" ? "en" : "cs";
      const theme = params.get("theme") === "dark" ? "dark" : "light";
      const state = ["arriving", "ordered", "none", "delivered"].includes(params.get("state"))
        ? params.get("state")
        : "arriving";
      const period = ["month", "year", "all"].includes(params.get("period"))
        ? params.get("period")
        : undefined;
      const cart = ["empty", "many"].includes(params.get("cart")) ? params.get("cart") : "default";
      // ?grid=sections&width=500[&rows=4]: lay the cards out like HA's sections
      // view; `rows` forces a user-chosen fixed height on every card.
      const sections = params.get("grid") === "sections";
      const sectionWidth = Number(params.get("width")) || 500;
      const forcedRows = params.has("rows") ? Number(params.get("rows")) : undefined;
      // ?legacy=1: set the forced rows the pre-2024.11 way (layout_options).
      const legacyLayout = params.get("legacy") === "1";
      const compactDelivery = params.get("compact") === "1";
      // ?pair=1: the slots card at half width, sharing a row with the account card.
      const pairRow = params.get("pair") === "1";
      // ?compactcols=12: compact delivery with only a user-chosen width.
      const compactCols = params.has("compactcols") ? Number(params.get("compactcols")) : undefined;

      document.documentElement.lang = lang;
      if (theme === "dark") document.body.setAttribute("data-theme", "dark");

      installFixedClock();
      installShims();

      if (state === "delivered") {
        writeDeliveredMemory();
      } else {
        clearDeliveryMemory();
      }

      const CARD_TAGS = [
        "rohlik-delivery-card",
        "rohlik-cart-card",
        "rohlik-slots-card",
        "rohlik-account-card",
        "rohlik-spending-card",
        "rohlik-favourites-card",
      ];
      const BADGE_TAGS = ["rohlik-delivery-badge"];
      const ALL_TAGS = [...CARD_TAGS, ...BADGE_TAGS];

      async function main() {
        // Registers every custom element (self-registering on import).
        await import("../../../dist/rohlik-cards.js");
        await Promise.all(ALL_TAGS.map((tag) => customElements.whenDefined(tag)));

        const hass = buildHass({ lang, state, cart });

        let section;
        if (sections) {
          document.querySelector(".grid").style.display = "none";
          section = document.createElement("div");
          section.className = "ha-section";
          section.id = "ha-section";
          section.style.width = `${sectionWidth}px`;
          document.getElementById("app").appendChild(section);
        }

        const mounted = [];
        for (const tag of CARD_TAGS) {
          const host = document.getElementById(tag);
          const el = document.createElement(tag);
          const config = { type: `custom:${tag}`, device: DEVICE_ID };
          if (tag === "rohlik-cart-card") {
            config.min_order = 749;
          }
          if (tag === "rohlik-delivery-card" && compactDelivery) {
            config.compact = true;
            if (compactCols !== undefined) config.grid_options = { columns: compactCols };
          }
          if (tag === "rohlik-slots-card" && pairRow) {
            config.grid_options = { columns: 6 };
          }
          if (tag === "rohlik-slots-card" && params.get("windows") === "1") {
            config.show_windows = true;
          }
          if (tag === "rohlik-spending-card" && period) {
            config.default_period = period;
          }
          if (forcedRows !== undefined) {
            if (legacyLayout) config.layout_options = { grid_rows: forcedRows };
            else config.grid_options = { rows: forcedRows };
          }
          el.setConfig(config);
          el.hass = hass;
          if (section) {
            // HA merges the card's own grid options with the user's.
            el.layout = "grid";
            // hui-card migrates layout_options when grid_options is absent.
            const user = config.grid_options
              ?? (config.layout_options ? { rows: config.layout_options.grid_rows } : {});
            const options = { ...el.getGridOptions(), ...user };
            const rows = typeof options.rows === "number"
              ? Math.max(options.rows, options.min_rows ?? 0)
              : "auto";
            const cell = document.createElement("div");
            cell.className = "card" + (typeof rows === "number" ? " fit-rows" : "");
            cell.dataset.tag = tag;
            cell.style.setProperty("--column-size", String(options.columns ?? 12));
            if (typeof rows === "number") cell.style.setProperty("--row-size", String(rows));
            const wrapper = document.createElement("hui-card");
            wrapper.appendChild(el);
            cell.appendChild(wrapper);
            section.appendChild(cell);
          } else {
            host.appendChild(el);
          }
          mounted.push(el);
        }
        for (const tag of BADGE_TAGS) {
          const host = document.getElementById(tag);
          const el = document.createElement(tag);
          el.setConfig({ type: `custom:${tag}`, device: DEVICE_ID, show_name: true });
          el.hass = hass;
          host.appendChild(el);
          mounted.push(el);
        }

        // Let every LitElement finish its first render pass.
        await Promise.all(mounted.map((el) => (el.updateComplete ? el.updateComplete : Promise.resolve())));
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        window.__PREVIEW_READY__ = true;
      }

      main().catch((err) => {
        console.error("preview init failed", err);
        window.__PREVIEW_ERROR__ = String((err && err.stack) || err);
      });
    </script>
  </body>
</html>
